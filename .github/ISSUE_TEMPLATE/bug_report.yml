name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a suspected security/soundness issue (a broken invariant from `docs/SECURITY-MODEL.md`), please use GitHub's private security advisory flow instead — see `SECURITY.md`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Observed behavior vs. what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands, code, or a failing test.
    validations:
      required: true
  - type: input
    id: crate
    attributes:
      label: Crate / contract
      placeholder: e.g. occulta-verifier
  - type: input
    id: version
    attributes:
      label: soroban-sdk / commit
