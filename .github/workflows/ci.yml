name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test (workspace, incl. differential fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fixture-backed differential tests are ordinary `#[test]`s that read committed files
      # under fixtures/ — no network access needed, no snarkjs/circom invoked at test time.
      - run: cargo test --workspace
      # The one test that shows a real snarkjs proof verifies on-chain. Run it by exact name
      # and require that exactly one test ran, so deleting or renaming it fails CI instead of
      # silently filtering to zero tests.
      - name: snarkjs fixture verifies (must exist and pass)
        run: |
          out=$(cargo test -p occulta-verifier --lib -- --exact tests::fixture::fixture_proof_verifies 2>&1)
          echo "$out"
          echo "$out" | grep -q "test result: ok. 1 passed"

  contracts:
    name: stellar contract build + wasm size report
    runs-on: ubuntu-latest
    # contracts/registry is a real contract and must build. The remaining crates are still
    # scaffolds (see README status table) and are skipped until they get #[contractimpl] code.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Install Stellar CLI
        # Pinned exact (not a `^23` range): an open range re-resolves on every run, so a new
        # patch release could change which CLI we get with no change in this repo. Bump
        # deliberately when needed.
        #
        # Not `--locked`: stellar-cli 23.4.1's shipped Cargo.lock pins ethnum 1.5.2, which
        # `unsafe { mem::transmute(()) }`s into `TryFromIntError` (source/target size
        # mismatch: 0 bits vs 8 bits) - this only became a hard E0512 error, not just UB,
        # once rustc's TryFromIntError layout changed, so `--locked` deterministically fails
        # to compile against current stable regardless of which CI runner's Rust it hits.
        # ethnum 1.5.3 fixes it; letting cargo re-resolve the transitive graph (while still
        # pinning the stellar-cli version itself) picks that up.
        run: cargo install stellar-cli --version 23.4.1
      - name: Build contracts/registry (must succeed)
        run: stellar contract build --package occulta-contract-registry
      - name: Build remaining contract crates (scaffolds may skip)
        run: |
          for dir in contracts/shielded-pool/ apps/*/; do
            if [ -f "$dir/Cargo.toml" ]; then
              echo "::group::stellar contract build: $dir"
              (cd "$dir" && stellar contract build) || echo "SKIP (not yet a real contract): $dir"
              echo "::endgroup::"
            fi
          done
      - name: Wasm size report
        run: |
          echo "### Wasm size report" >> "$GITHUB_STEP_SUMMARY"
          find . -path '*/target/wasm32v1-none/release/*.wasm' -exec ls -la {} \; >> "$GITHUB_STEP_SUMMARY" || true

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit
      - run: cargo audit
