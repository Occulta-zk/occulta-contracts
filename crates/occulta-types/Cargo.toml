[package]
name = "occulta-types"
description = "Shared contracttypes and snarkjs<->Soroban byte-level encoding helpers for Occulta."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false

[features]
# snarkjs JSON -> VerificationKey / Proof conversion. Needs std; never enable in a contract.
snarkjs = ["dep:serde_json"]

[dependencies]
soroban-sdk = { workspace = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
serde_json = "1"
